[package]
name = "yoga-patient-crm"
version = "0.1.0"
description = "Desktop CRM for yoga-based patient rehabilitation tracking"
authors = ["YogaCare"]
edition = "2021"

[lib]
name = "yoga_patient_crm_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.4.1", features = [] }

[dependencies]
tauri = { version = "2.8.0", features = [] }
tauri-plugin-opener = "2.5.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
